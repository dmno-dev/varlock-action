# Keep dependencies in sync, especially varlock
# https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    # Prioritize varlock updates
    groups:
      varlock:
        patterns:
          - "varlock"
        update-types:
          - "minor"
          - "patch"
